        const App = () => {
            const [masterData, setMasterData] = useState([]);
            const [selectedCompany, setSelectedCompany] = useState(null);
            const [searchTerm, setSearchTerm] = useState("");
            const [isLoading, setIsLoading] = useState(true);

            useEffect(() => {
                const parseCSV = (csvStr) => {
                    const parsed = window.Papa.parse(csvStr.trim(), { header: true, delimiter: ";", skipEmptyLines: true });
                    return parsed.data;
                };

                const normalize = (str) => str ? str.toUpperCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "") : "";

                try {
                    const dataElegibilidade = parseCSV(CSV_ELEGIBILIDADE);
                    const dataBase = parseCSV(CSV_BASE_EMPRESAS);
                    const dataInd1 = parseCSV(CSV_INDICADOR_1);
                    const dataInd2 = parseCSV(CSV_INDICADOR_2);
                    const dataInd3 = parseCSV(CSV_INDICADOR_3);
                    const dataFinal = parseCSV(CSV_RESULTADO_FINAL);

                    const companiesMap = {};

                    // Passo 1: Carregar todas as empresas da aba de Elegibilidade (onde Laticínios e Correios estão confirmadas como Elegíveis)
                    dataElegibilidade.forEach(row => {
                        const name = normalize(row.Empresa);
                        if (name) {
                            const isElegivel = (row['Situação Matrícula'] || row['Situação Elegibilidade'] || "").trim().toUpperCase() === "ELEGÍVEL";
                            companiesMap[name] = {
                                id: name,
                                empresa: row.Empresa.trim(),
                                unidade: "Não Informada", 
                                pontuacao: 0,
                                rank: 9999, // 9999 indica 'Fora do Top 10'
                                elegivel: isElegivel,
                                motivoElegibilidade: isElegivel ? "Aprovada na análise inicial de elegibilidade." : "Não atendeu aos critérios na Análise de Elegibilidade (Ex: cotas, situação cadastral).",
                                notas: { indicador1: 0, indicador2: 0, indicador3: 0 }
                            };
                        }
                    });

                    // Passo 2: Cadastrar empresas da Base Geral que sequer entraram na aba Elegibilidade
                    dataBase.forEach(row => {
                        const name = normalize(row.EmpresaAluno || row.Empresa);
                        if (name) {
                            if (!companiesMap[name]) {
                                companiesMap[name] = {
                                    id: name,
                                    empresa: (row.EmpresaAluno || row.Empresa).trim(),
                                    unidade: row.Unidade ? row.Unidade.trim() : "SENAI GO",
                                    pontuacao: 0,
                                    rank: 9999,
                                    elegivel: false,
                                    motivoElegibilidade: "Ausente na planilha oficial de Análise de Elegibilidade.",
                                    notas: { indicador1: 0, indicador2: 0, indicador3: 0 }
                                };
                            } else {
                                // Apenas atualiza a Unidade se já existir
                                if (row.Unidade) companiesMap[name].unidade = row.Unidade.trim();
                            }
                        }
                    });

                    // Passo 3: Atribuir Notas extraindo a última coluna de cada indicador (onde fica a pontuação real)
                    const setIndScore = (data, indKey) => {
                        data.forEach(row => {
                            const name = normalize(row.Empresa);
                            if (name && companiesMap[name]) {
                                const keys = Object.keys(row);
                                if (keys.length > 0) {
                                    const rawScore = row[keys[keys.length - 1]];
                                    // Se o formato vier como "-5", substituir para evitar erro de número
                                    const scoreStr = typeof rawScore === 'string' ? rawScore.replace(',', '.') : rawScore;
                                    const score = Number(scoreStr);
                                    companiesMap[name].notas[indKey] = isNaN(score) ? 0 : score;
                                }
                            }
                        });
                    };
                    setIndScore(dataInd1, 'indicador1');
                    setIndScore(dataInd2, 'indicador2');
                    setIndScore(dataInd3, 'indicador3');

                    // Passo 4: Atribuir Posição Final e Nota Final Exata
                    dataFinal.forEach(row => {
                        const name = normalize(row.Empresa);
                        if (name && companiesMap[name]) {
                            const scoreStr = row['Pontuação'] || row['Pontuacao'];
                            companiesMap[name].pontuacao = Number(typeof scoreStr === 'string' ? scoreStr.replace(',', '.') : scoreStr) || 0;
                            companiesMap[name].rank = Number(row['Rkn'] || row['Rank'] || row['Rótulos de Linha']) || 9999;
                        }
                    });

                    const finalArray = Object.values(companiesMap).sort((a, b) => a.rank - b.rank);
                    setMasterData(finalArray);
                    if (finalArray.length > 0) setSelectedCompany(finalArray[0]); 
                    
                    setIsLoading(false);
                } catch (error) {
                    console.error("Erro ao processar planilhas CSV:", error);
                    setIsLoading(false);
                }
            }, []);

            const top10Data = useMemo(() => masterData.filter(d => d.rank <= 10).sort((a, b) => a.rank - b.rank), [masterData]);

            const fuse = useMemo(() => new window.Fuse(masterData, {
                keys: ['empresa', 'unidade'],
                threshold: 0.4, 
                ignoreLocation: true,
                shouldSort: true,
                minMatchCharLength: 2
            }), [masterData]);

            const filteredSearch = useMemo(() => {
                if (!searchTerm.trim()) return [];
                return fuse.search(searchTerm).map(result => result.item).slice(0, 15);
            }, [searchTerm, fuse]);

            // Motor de Auditoria Atualizado
            const generateAuditReport = (company) => {
                let issues = [];
                
                if (!company.elegivel) {
                    issues.push(`🚨 EMPRESA INELEGÍVEL: ${company.motivoElegibilidade}`);
                    return issues; // Encerra verificação se nem elegível for
                }

                // Empresa Elegível mas fora do Top 10
                if (company.rank > 10) {
                    issues.push(`✅ EMPRESA ELEGÍVEL. Contudo, a avaliação de desempenho (Total: ${company.pontuacao} pts) foi inferior ao grupo Top 10.`);
                } else {
                    return null; // Top 10 Elegível e Impecável, não mostra avisos
                }
                
                const lostInd1 = MAX_SCORES.indicador1 - company.notas.indicador1;
                const lostInd2 = MAX_SCORES.indicador2 - company.notas.indicador2;
                const lostInd3 = MAX_SCORES.indicador3 - company.notas.indicador3;

                if (lostInd1 > 0) issues.push(`⚠️ Déficit de ${lostInd1} pts no Indicador 1 (Áreas Finalísticas da Indústria).`);
                if (lostInd2 > 0) issues.push(`⚠️ Déficit de ${lostInd2} pts no Indicador 2 (Taxa de Conclusão).`);
                if (lostInd3 > 0) issues.push(`⚠️ Perda de ${lostInd3} pts no Indicador 3 (Proporção Matrículas / Trabalhadores).`);

                return issues;
            };

            if (isLoading) {
                return <div className="min-h-screen flex items-center justify-center text-royal font-bold text-xl">Consolidando Base de Dados...</div>;
            }

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-7xl mx-auto">
                        
                        {/* Cabeçalho e Busca */}
                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-8 gap-6">
                            
                            <div className="flex-1 w-full">
                                <div className="flex justify-between items-center w-full">
                                    <div>
                                        <h1 className="text-2xl md:text-3xl font-black text-royal">🏆 Premiação Aprendizagem SENAI 2025</h1>
                                        <p className="text-sm md:text-base text-gray-500 mt-1 flex items-center">
                                            <span className="w-2 h-2 rounded-full bg-green-500 mr-2 animate-pulse"></span>
                                            Base de Dados Integrada em Tempo Real
                                        </p>
                                    </div>
                                    <img src="https://i.postimg.cc/gkZfCjRv/marca-4º-workshop-01.png" alt="Logo" className="h-12 md:h-16 object-contain block lg:hidden ml-4" />
                                </div>
                            </div>

                            {/* Barra de Busca Avançada */}
                            <div className="flex items-center gap-6 w-full lg:w-auto z-50">
                                <div className="relative w-full md:w-[420px]">
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <IconSearch />
                                        </div>
                                        <input
                                            type="text"
                                            className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-orange shadow-sm"
                                            placeholder="Busque Bela Vista, Correios, ou qualquer outra..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                        />
                                    </div>

                                    {searchTerm && (
                                        <div className="absolute mt-2 w-full bg-white rounded-xl shadow-xl border border-gray-100 max-h-80 overflow-y-auto search-results">
                                            {filteredSearch.length > 0 ? (
                                                filteredSearch.map(comp => (
                                                    <div 
                                                        key={comp.id}
                                                        onClick={() => { setSelectedCompany(comp); setSearchTerm(""); }}
                                                        className="p-3 border-b hover:bg-gray-50 cursor-pointer flex justify-between items-center"
                                                    >
                                                        <div>
                                                            <div className="font-bold text-royal text-sm">{comp.empresa}</div>
                                                            <div className="flex items-center gap-2 mt-1 text-xs font-medium">
                                                                <span className="text-gray-500">{comp.unidade}</span>
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-col items-end">
                                                            {comp.elegivel ? (
                                                                <span className="text-xs font-bold text-green-600 bg-green-100 px-2 py-0.5 rounded">ELEGÍVEL</span>
                                                            ) : (
                                                                <span className="text-xs font-bold text-red-600 bg-red-100 px-2 py-0.5 rounded">INELEGÍVEL</span>
                                                            )}
                                                            {comp.rank < 9999 && (
                                                                <span className="text-xs font-bold text-gray-500 mt-1">Rank: {comp.rank}º</span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))
                                            ) : (
                                                <div className="p-4 text-sm text-gray-500 text-center">Nenhuma empresa correspondente na base total.</div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <img src="https://i.postimg.cc/gkZfCjRv/marca-4º-workshop-01.png" alt="Logo" className="h-16 xl:h-[72px] object-contain hidden lg:block hover:scale-105 transition-transform" />
                            </div>
                        </div>

                        {/* Cards de Parâmetros Máximos */}
                        <div className="mb-8">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center">
                                <IconInfo /> <span className="ml-2">Parâmetros de Avaliação (Máximo: 60 pts)</span>
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            
                            <div className="lg:col-span-2 space-y-8">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-xl font-bold text-royal mb-6">Ranking Oficial: Top 10</h2>
                                    
                                    <div className="h-[480px] w-full">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <BarChart data={top10Data} layout="vertical" margin={{ top: 10, right: 45, left: 0, bottom: 10 }}>
                                                <CartesianGrid strokeDasharray="3 3" horizontal={false} stroke="#e2e8f0" />
                                                <XAxis type="number" domain={[0, 60]} hide={false} tick={{fill: '#94a3b8'}} />
                                                <YAxis dataKey="empresa" type="category" width={260} interval={0} tick={{ fontSize: 10, fill: '#475569', fontWeight: 600 }} />
                                                <Tooltip cursor={{fill: '#f8fafc'}} contentStyle={{ borderRadius: '8px', border: 'none' }} />
                                                <Bar dataKey="pontuacao" radius={[0, 4, 4, 0]} barSize={22} onClick={(data) => setSelectedCompany(data)}>
                                                    {top10Data.map((entry, index) => (
                                                        <Cell key={`cell-${index}`} fill={entry.id === selectedCompany?.id ? '#ea580c' : (index < 3 ? '#fb923c' : '#1e3a8a')} className="cursor-pointer" />
                                                    ))}
                                                    <LabelList dataKey="pontuacao" position="right" fill="#ea580c" fontWeight="bold" fontSize={13} />
                                                </Bar>
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <p className="text-xs text-gray-400 mt-4 text-center">* Clique em qualquer barra ou utilize a busca para abrir a auditoria detalhada.</p>
                                </div>
                            </div>

                            {/* Detalhamento da Empresa Selecionada */}
                            <div className="lg:col-span-1">
                                {selectedCompany && (
                                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-6">
                                        <div className="flex justify-between items-start mb-4">
                                            <h3 className="text-lg font-black text-royal leading-tight pr-4">{selectedCompany.empresa}</h3>
                                            {selectedCompany.rank <= 3 && <IconTrophy />}
                                        </div>
                                        
                                        <div className="flex items-center gap-2 mb-6">
                                            <span className="bg-gray-100 text-gray-600 px-3 py-1 rounded-full text-xs font-bold border border-gray-200">
                                                Unidade: {selectedCompany.unidade}
                                            </span>
                                            {selectedCompany.elegivel ? (
                                                <span className={`px-3 py-1 rounded-full text-xs font-bold ${selectedCompany.rank <= 10 ? 'bg-orange/10 text-orange' : 'bg-green-100 text-green-700'}`}>
                                                    {selectedCompany.rank < 9999 ? `Rank: ${selectedCompany.rank}º` : 'Elegível, s/ Rank'}
                                                </span>
                                            ) : (
                                                <span className="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700">INELEGÍVEL</span>
                                            )}
                                        </div>

                                        <div className="mb-6 flex justify-between items-end pb-4 border-b border-gray-100">
                                            <div>
                                                <p className="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Nota Final Obtida</p>
                                                <div className="text-4xl font-black text-royal">{selectedCompany.pontuacao} <span className="text-lg text-gray-400 font-normal">/ 60</span></div>
                                            </div>
                                        </div>

                                        <div>
                                            <h4 className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">Notas por Indicador</h4>
                                            <div className="space-y-4">
                                                {Object.entries(selectedCompany.notas).map(([criterio, nota]) => {
                                                    const max = MAX_SCORES[criterio];
                                                    const percent = Math.max(0, Math.min(100, (nota / max) * 100)); // Previne barras negativas
                                                    return (
                                                        <div key={criterio}>
                                                            <div className="flex justify-between text-sm mb-1">
                                                                <span className="font-medium text-gray-700 capitalize">{CRITERIA_NAMES[criterio]}</span>
                                                                <span className={`font-bold ${nota < 0 ? 'text-red-500' : 'text-royal'}`}>{nota} <span className="text-gray-400 text-xs font-normal">/ {max}</span></span>
                                                            </div>
                                                            <div className="w-full bg-gray-200 rounded-full h-2">
                                                                <div className={`h-2 rounded-full ${percent === 100 ? 'bg-orange' : (nota < 0 ? 'bg-red-500' : 'bg-royal')}`} style={{ width: `${percent}%` }}></div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            
                                            {(() => {
                                                const issues = generateAuditReport(selectedCompany);
                                                if (issues && issues.length > 0) {
                                                    return (
                                                        <div className="mt-6 pt-6 border-t border-gray-100">
                                                            <h4 className="text-sm font-bold text-orange flex items-center mb-3">
                                                                <IconAlert /> <span className="ml-2 uppercase tracking-wider text-xs">Parecer de Auditoria</span>
                                                            </h4>
                                                            <ul className="space-y-2">
                                                                {issues.map((issue, idx) => (
                                                                    <li key={idx} className="text-xs text-gray-600 bg-orange/5 p-3 rounded-lg border border-orange/20">
                                                                        {issue}
                                                                    </li>
                                                                ))}
                                                            </ul>
                                                        </div>
                                                    );
                                                }
                                                return (
                                                    <div className="mt-6 pt-6 border-t border-gray-100 bg-emerald-50 p-4 rounded-xl border border-emerald-100 text-center">
                                                        <p className="text-xs text-emerald-700 font-bold">✨ Empresa no Top 10 em Plena Conformidade</p>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
